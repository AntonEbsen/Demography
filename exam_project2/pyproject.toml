[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "exam_project2"
version = "0.1.0"
authors = [
  { name="Anton Ebsen", email="contact@antonebsen.dk" },
]
description = "A cliometric analysis of the Prussian Kulturkampf and its demographic consequences."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.21.0",
    "linearmodels>=4.25",
    "geopandas>=0.12.0",
    "scipy>=1.9.0",
    "matplotlib>=3.6.0",
    "seaborn>=0.12.0",
    "statsmodels>=0.13.0",
    "pyarrow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.0.260",
    "black>=23.1.0",
    "mypy>=1.0.0",
    "pandas-stubs>=1.5.0",
]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
plugins = ["numpy.typing.mypy_plugin"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
