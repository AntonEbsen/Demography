site_name: Demography Research Framework
site_url: https://your-username.github.io/Demography/
theme:
  name: material
  palette:
    - scheme: slate
      primary: deep orange
      accent: deep orange
  features:
    - navigation.tabs
    - search.suggest
    - search.highlight

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [exam_project/src]

nav:
  - Home: index.md
  - API Reference: api.md
  - Methodology: methodology.md
