name: Submitted Table 6.1 audit
on:
  pull_request:
    paths:
      - 'scripts/audit_table_6_1.py'
      - 'requirements-table-6-1.txt'
      - 'reproducibility/table-6-1/**'
      - 'tests/test_table_6_1_audit.py'
      - 'exam_project2/src/**'
      - 'exam_project2/data/raw/**'
      - '.github/workflows/table-6-1-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  table-audit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-table-6-1.txt
      - run: python -m pip install -r requirements-table-6-1.txt
      - run: python -m unittest discover -s tests -p test_table_6_1_audit.py
      - run: python scripts/audit_table_6_1.py --verify --output scratch/table-6-1-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: table-6-1-${{ matrix.os }}
          path: scratch/table-6-1-results.json
