name: Python CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with ruff
      run: make lint
    - name: Test with pytest
      run: make test

  research-audit:
    name: Expert Research Audit
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install Quarto
      uses: quarto-dev/quarto-actions/setup@v2
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run Spatial Diagnostics
      run: make spatial
    - name: Run Spatial Regression (SLM)
      run: make spatial-reg
    - name: Generate Research Brief
      run: make memo
    - name: Upload Research Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: research-audit-pack
        path: |
          research_brief.pdf
          exam_project/outputs/spatial/*.png
          exam_project/outputs/spatial/*.txt
