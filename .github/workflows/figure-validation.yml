name: Submitted figure validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  figure-4-1:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: reproduction/figure-4-1/requirements.lock.txt
      - name: Reproduce Figure 4.1 in its isolated locked environment
        run: python scripts/reproduce_figure_4_1.py --output-dir "${{ runner.temp }}/figure-4-1"
      - uses: actions/upload-artifact@v4
        with:
          name: figure-4-1-validation-${{ matrix.os }}
          path: ${{ runner.temp }}/figure-4-1
