name: DVC Pipeline Test

on:
  push:
    branches: [ main ]
    paths:
      - 'exam_project2/src/**'
      - 'exam_project2/dvc.yaml'
  pull_request:
    branches: [ main ]

jobs:
  test-dvc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dvc
          # Prefer lockfile if available
          if [ -f requirements.lock ]; then
            pip install -r requirements.lock
          else
            pip install -r requirements.txt
          fi
          
      - name: DVC DAG Validation
        working-directory: ./exam_project2
        run: |
          # Dry run validates the DAG and script availability without downloading massive datasets
          dvc repro --dry-run
