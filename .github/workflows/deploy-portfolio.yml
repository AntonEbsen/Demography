name: Deploy Portfolio

on:
  push:
    branches: [ main ]
    paths:
      - 'portfolio/**'
      - '.github/workflows/deploy-portfolio.yml'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: portfolio/package-lock.json

      - name: Install, build, and upload with Astro
        uses: withastro/action@v3
        with:
          path: portfolio
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
